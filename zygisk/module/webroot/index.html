<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Flexible eSIM Transfer</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1 data-text="title"></h1><p id="status" role="status" aria-live="polite" data-text="loading"></p>
<p data-text="risk"></p><p data-text="activation"></p>
<section><h2 data-text="destination"></h2><button id="refresh" data-text="refresh"></button> <label><input id="reveal" type="checkbox"><span data-text="reveal"></span></label>
<fieldset id="cards"><legend data-text="choose"></legend></fieldset>
<label><input id="manual" type="checkbox"><span data-text="manual"></span></label>
<div id="manualFields" hidden><label><span data-text="eid"></span> <input id="eid" type="password" autocomplete="off" spellcheck="false"></label><label><span data-text="port"></span> <input id="port" type="text" inputmode="numeric" autocomplete="off"></label></div>
<label><input id="preserve" type="checkbox"><span data-text="preserve"></span></label>
<p data-text="preserveHelp"></p>
<button id="save" data-text="save"></button><button id="off" data-text="off"></button>
</section><section><h2 data-text="diagnostics"></h2><p data-text="diagnosticsHelp"></p>
<label><span data-text="duration"></span> <select id="duration"><option value="" data-text="chooseDuration"></option><option value="300" data-minutes="5"></option><option value="900" data-minutes="15"></option><option value="1800" data-minutes="30"></option><option value="3600" data-minutes="60"></option></select></label>
<button id="start" data-text="start"></button><button id="stop" data-text="stop"></button><button id="review" data-text="review"></button><button id="export" data-text="export"></button><button id="delete" data-text="delete"></button>
<pre id="report" tabindex="0"></pre></section>
<p id="message" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></body></html>
