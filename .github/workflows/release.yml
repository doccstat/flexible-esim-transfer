name: Signed release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'doccstat/flexible-esim-transfer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build without signing credentials
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools -p 'test_*.py'
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Sign with the permanent key and verify the release identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/flexible-esim-transfer-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$SIGNING_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$SIGNING_KEYSTORE"
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -c -p 4 app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" sign --ks "$SIGNING_KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out dist/FlexibleEsimTransfer.apk app/build/outputs/apk/release/app-release-unsigned.apk
          tag=$(python3 tools/release.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')
          python3 tools/release.py verify dist/FlexibleEsimTransfer.apk "$tag"
          (cd dist && sha256sum FlexibleEsimTransfer.apk >FlexibleEsimTransfer.apk.sha256)
      - name: Publish the stable source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; skipping this superseded build.'
            exit 0
          fi
          metadata=$(python3 tools/release.py metadata)
          tag=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])' <<<"$metadata")
          version=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"$metadata")
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length > 0' <<<"$releases" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --method PATCH \
              -f "sha=$GITHUB_SHA" -F force=true
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/FlexibleEsimTransfer.apk dist/FlexibleEsimTransfer.apk.sha256
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$version" \
              --notes-file RELEASE_NOTES.md --draft=false --prerelease=false --latest
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$version" --notes-file RELEASE_NOTES.md --latest \
              dist/FlexibleEsimTransfer.apk dist/FlexibleEsimTransfer.apk.sha256
          fi
          # GITHUB_TOKEN release writes do not trigger release-event workflows.
          gh workflow run distribute-release.yml --repo "$GITHUB_REPOSITORY" --ref main
