name: Distribute latest release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

env:
  LISTING_REPOSITORY: Xposed-Modules-Repo/com.lixingchi.flexibleesimtransfer

jobs:
  distribute:
    if: >-
      github.repository == 'doccstat/flexible-esim-transfer' &&
      ((github.event_name == 'release' && github.event.action == 'published') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the latest stable source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          tag=$(jq -r .tag_name <<<"$release_json")
          [[ "$tag" =~ ^[1-9][0-9]*-[0-9]+(\.[0-9]+)+$ ]]
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = false
          printf '%s\n' "$tag" >"$RUNNER_TEMP/release-tag"
          jq -r .name <<<"$release_json" >"$RUNNER_TEMP/release-title"
          jq -r .body <<<"$release_json" >"$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Download and verify the exact source APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tag=$(cat "$RUNNER_TEMP/release-tag")
          mkdir -p "$RUNNER_TEMP/verified-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'FlexibleEsimTransfer.apk' --pattern 'FlexibleEsimTransfer.apk.sha256' \
            --dir "$RUNNER_TEMP/verified-release"
          python3 tools/release.py verify "$RUNNER_TEMP/verified-release/FlexibleEsimTransfer.apk" "$tag" \
            --checksum "$RUNNER_TEMP/verified-release/FlexibleEsimTransfer.apk.sha256"
      - name: Create or replace the matching listing release
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          repo="$LISTING_REPOSITORY"
          tag=$(cat "$RUNNER_TEMP/release-tag")
          releases=$(gh api --paginate --slurp "repos/$repo/releases?per_page=100")
          if jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length > 0' <<<"$releases" >/dev/null; then
            gh release upload "$tag" --repo "$repo" --clobber \
              "$RUNNER_TEMP/verified-release/FlexibleEsimTransfer.apk" \
              "$RUNNER_TEMP/verified-release/FlexibleEsimTransfer.apk.sha256"
            gh release edit "$tag" --repo "$repo" \
              --title "$(cat "$RUNNER_TEMP/release-title")" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease=false --latest
          else
            gh release create "$tag" --repo "$repo" \
              --title "$(cat "$RUNNER_TEMP/release-title")" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest \
              "$RUNNER_TEMP/verified-release/FlexibleEsimTransfer.apk" \
              "$RUNNER_TEMP/verified-release/FlexibleEsimTransfer.apk.sha256"
          fi
