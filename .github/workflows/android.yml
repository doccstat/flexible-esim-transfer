name: Android checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;30.0.16248370' 'cmake;3.31.0'
      - name: Test, lint and build
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools -p 'test_*.py'
          ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:assembleRelease :zygisk:lintRelease :zygisk:assembleRelease
          mapfile -t api < <(find "$HOME/.gradle/caches/modules-2/files-2.1/io.github.libxposed/api/101.0.0" -name '*.aar')
          test "${#api[@]}" -eq 1
          python3 tools/build_zygisk.py --sdk "$ANDROID_HOME" --ndk "$ANDROID_HOME/ndk/30.0.16248370" \
            --java "$JAVA_HOME" --api "${api[0]}" --cmake "$ANDROID_HOME/cmake/3.31.0/bin/cmake" \
            --ninja "$ANDROID_HOME/cmake/3.31.0/bin/ninja" --out "$RUNNER_TEMP/zygisk-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk-and-zygisk
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            ${{ runner.temp }}/zygisk-build/FlexibleEsimTransfer-Zygisk.zip
            ${{ runner.temp }}/zygisk-build/FlexibleEsimTransfer-Zygisk.zip.sha256
          if-no-files-found: error
